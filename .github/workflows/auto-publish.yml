
  name: AI Agent Daily News Publisher

  on:
    schedule:
      # 每4小时运行一次，每天6次
      - cron: '0 0 * * *'   # 北京时间 08:00
      - cron: '0 4 * * *'   # 北京时间 12:00
      - cron: '0 8 * * *'   # 北京时间 16:00
      - cron: '0 12 * * *'  # 北京时间 20:00
      - cron: '0 16 * * *'  # 北京时间 00:00
      - cron: '0 20 * * *'  # 北京时间 04:00
    workflow_dispatch:
      inputs:
        mode:
          description: '发布模式'
          required: true
          default: 'daily'
          type: choice
          options:
            - daily
            - batch

  jobs:
    publish:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'
        - run: pip install -r requirements.txt
        - name: Publish
          env:
            WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
            WP_USERNAME: ${{ secrets.WP_USERNAME }}
            WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          run: python auto_publish.py --mode daily --hours 12 --items 10
